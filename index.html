label.fld{display:block;margin-bottom:15px}label.fld .lt{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px;display:block}
.inp{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14px;background:var(--card);color:var(--txt)}.inp:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,137,59,.13)}select.inp{appearance:none}

.svc-card{transition:border-color .15s,box-shadow .15s,transform .12s}.svc-card:hover{border-color:var(--gold);box-shadow:var(--sh-lg);transform:translateY(-2px)}.filebox b{color:var(--ink)}
.req{display:flex;align-items:center;gap:9px;padding:8px 0;font-size:13.5px;color:var(--steel)}.req .d{width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none}
.timeline{position:relative}.tnode{display:grid;grid-template-columns:32px 1fr;gap:13px;padding-bottom:20px;position:relative}.tnode:not(:last-child)::before{content:"";position:absolute;inset-inline-start:15px;top:28px;bottom:-4px;width:2px;background:var(--line)}.tnode.done:not(:last-child)::before{background:var(--gold)}
.tdot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--paper-2);color:var(--muted-2);border:2px solid var(--line);z-index:1;font-size:12px}.tnode.done .tdot{background:var(--gold);border-color:var(--gold);color:#fff}.tnode.current .tdot{background:#fff;border-color:var(--ink);color:var(--ink);box-shadow:0 0 0 4px rgba(14,39,64,.1)}
.tbody .tt{font-weight:600;color:var(--ink);font-size:14px}

.checkrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}.checkrow:last-child{border-bottom:none}.checkrow .cl{display:flex;align-items:center;gap:10px;font-size:13.5px}
.toggle{width:46px;height:27px;border-radius:30px;background:var(--paper-2);border:1.5px solid var(--line);position:relative;flex:none;transition:background .18s,border-color .18s}.toggle::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:inset-inline-start .18s}.toggle.on{background:var(--ok);border-color:var(--ok)}.toggle.on::after{inset-inline-start:21px}

.seal{position:relative;display:inline-block}.seal svg{display:block;width:100%;height:100%}
@keyframes stampin{0%{transform:scale(1.7) rotate(-14deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-8deg);opacity:1}}.stamped{animation:stampin .5s cubic-bezier(.2,.8,.2,1) both}
.qrportal{max-width:560px;margin:0 auto}.qrcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-lg);overflow:hidden}.qrcard .top{background:linear-gradient(135deg,var(--ink),var(--ink-2));color:#fff;padding:18px 22px;display:flex;align-items:center;gap:12px}.qrcard .body{padding:clamp(18px,3vw,26px)}
#qrbox,.qrmini{display:grid;place-items:center;padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px;width:fit-content;margin:0 auto 14px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}.kv:last-child{border-bottom:none}.kv .k{color:var(--muted)}.kv .v{font-weight:600;color:var(--ink);text-align:end}

.empty{text-align:center;padding:40px 20px;color:var(--muted)}.hairnote{font-size:12px;color:var(--muted-2);margin-top:8px}

<section id="setup" class="hide"><div class="box"><div class="seal" style="width:46px;height:46px" id="sealSetup"></div>

<p style="color:var(--muted)">عدّل أول سطرين في إعدادات <code>index.html</code> بمفاتيح مشروعك.</p>
<ol><li>Supabase → Project Settings → API</li><li>انسخ <code>Project URL</code> و <code>anon public</code></li><li>ضعهما في <code>SUPABASE_URL</code> و <code>SUPABASE_ANON_KEY</code></li><li>شغّل <code>schema.sql</code></li></ol></div></section>

<script>

const SUPABASE_URL="https://gdwyjyfpiuhjshvxxlog.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable__VQLR6FPXE0Ktbdqq-IPxw_Mm-L6m1-";

/* ============ i18n ============ */
const I={

async function sha256Hex(input){const data=input instanceof ArrayBuffer?input:new TextEncoder().encode(String(input));const b=await crypto.subtle.digest("SHA-256",data);return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
async function sha256File(f){return sha256Hex(await f.arrayBuffer());}

function guillochePaths(){let p="";for(let k=0;k<5;k++){let d="";for(let i=0;i<=360;i+=3){const a=i*Math.PI/180,r=70+(18-k*3)*Math.sin(a*(6+k));d+=(i?"L":"M")+(100+r*Math.cos(a)).toFixed(1)+","+(100+r*Math.sin(a)).toFixed(1)+" "}p+=`<path d="${d}Z" fill="none" stroke="#E9D9B6" stroke-width=".5"/>`}return p;}

/* ============ data ============ */
async function loadProfile(){const{data}=await sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle();return data;}
async function fetchDocs(){const{data,error}=await sb.from("documents").select("*").order("created_at",{ascending:false});if(error)console.warn(error.message);state.docs=data||[];}
async function logEvent(action,entity){try{await sb.from("audit_log").insert({action,entity:entity||null,actor_name:profile?.full_name||session.user.email});}catch(e){}}
async function updateDoc(id,patch,action,entity){const{error}=await sb.from("documents").update(patch).eq("id",id);if(error)throw error;if(action)await logEvent(action,entity);await fetchDocs();}
async function fetchFees(){try{const{data}=await sb.from("fees").select("*");const m={};(data||[]).forEach(r=>m[r.service_type]={o:Number(r.office_fee),m:Number(r.mission_fee)});state.fees=m;}catch(e){state.fees=null;}}
function feeFor(sv){return (state.fees&&state.fees[sv])||FEE[sv]||{o:0,m:0};}
async function fetchDocProfiles(){try{const{data}=await sb.from("doc_profiles").select("*");const m={};(data||[]).forEach(r=>m[r.doc_type]=Array.isArray(r.stamps)?r.stamps:[]);state.docProfiles=m;}catch(e){state.docProfiles=null;}}
function stampsFor(d){const m=state.docProfiles;if(m&&m[d.doc_type]&&m[d.doc_type].length)return m[d.doc_type];return (REQS[d.service_type]||[]).map(k=>REQ_LABEL[state.lang][k]||k);}
async function notify(d,template){const rows=[];if(d.email)rows.push({doc_id:d.id,channel:"email",to_addr:d.email,template,status:"queued",payload:{ref:d.ref_no,status:d.status}});if(d.phone)rows.push({doc_id:d.id,channel:"whatsapp",to_addr:d.phone,template,status:"queued",payload:{ref:d.ref_no,status:d.status}});if(rows.length)try{await sb.from("notifications").insert(rows);}catch(e){}}

/* ============ OCR (real, in-browser, lazy-loaded) ============ */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=()=>res();s.onerror=()=>rej(new Error("load failed"));document.head.appendChild(s);});}
async function ensureTesseract(){if(!window.Tesseract)await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js");}
async function ensurePdfjs(){if(!window.pdfjsLib)await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");}
async function pdfFirstPageToCanvas(blob){
 await ensurePdfjs();
 const buf=await blob.arrayBuffer();
 if(window.pdfjsLib&&pdfjsLib.GlobalWorkerOptions){try{pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";}catch(e){}}
 const pdf=await pdfjsLib.getDocument({data:buf}).promise;
 const page=await pdf.getPage(1);const vp=page.getViewport({scale:2});
 const canvas=document.createElement("canvas");canvas.width=vp.width;canvas.height=vp.height;
 await page.render({canvasContext:canvas.getContext("2d"),viewport:vp}).promise;return canvas;
}
function normAr(s){return String(s||"").replace(/[\u064B-\u0652]/g,"").replace(/[إأآا]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/\s+/g," ").trim().toLowerCase();}
function nameMatches(name,text){const nt=normAr(text);const parts=normAr(name).split(" ").filter(p=>p.length>=2);if(!parts.length)return false;let hit=0;parts.forEach(p=>{if(nt.includes(p))hit++;});return hit>=Math.min(2,parts.length);}
async function runOCR(d,onProgress){
 await ensureTesseract();
 if(!d.file_path) throw new Error("nofile");
 const{data:blob,error}=await sb.storage.from("documents").download(d.file_path);
 if(error||!blob) throw new Error(error?error.message:"download failed");
 const isPdf=(blob.type==="application/pdf")||/\.pdf$/i.test(d.file_path);
 const src=isPdf?await pdfFirstPageToCanvas(blob):URL.createObjectURL(blob);
 const{data:{text}}=await Tesseract.recognize(src,"ara+eng",{logger:m=>{if(onProgress&&m.status==="recognizing text")onProgress(Math.round(m.progress*100));}});
 if(!isPdf) try{URL.revokeObjectURL(src);}catch(e){}
 return text||"";
}
async function downloadOriginal(d){
 if(!d.file_path) throw new Error("nofile");
 const{data,error}=await sb.storage.from("documents").createSignedUrl(d.file_path,300);
 if(error||!data) throw new Error(error?error.message:"failed");
 window.open(data.signedUrl,"_blank");
}
async function detectStampInk(d){
 if(!d.file_path) throw new Error("nofile");
 const{data:blob,error}=await sb.storage.from("documents").download(d.file_path);
 if(error||!blob) throw new Error("download failed");
 const isPdf=(blob.type==="application/pdf")||/\.pdf$/i.test(d.file_path);
 const imgSrc=isPdf?await pdfFirstPageToCanvas(blob):await blobToImage(blob);
 const cv=document.createElement("canvas");const W=Math.min(500,imgSrc.width||500);const sc=W/(imgSrc.width||500);
 cv.width=W;cv.height=Math.round((imgSrc.height||500)*sc);const x=cv.getContext("2d");x.drawImage(imgSrc,0,0,cv.width,cv.height);
 const px=x.getImageData(0,0,cv.width,cv.height).data;let ink=0,tot=cv.width*cv.height;
 for(let i=0;i<px.length;i+=4){const r=px[i],g=px[i+1],b=px[i+2];const mx=Math.max(r,g,b),mn=Math.min(r,g,b);const sat=mx-mn;const lum=(r+g+b)/3;
  // saturated colored ink (blue/red/purple stamps), not near-white/near-black/gray
  if(sat>55&&lum>40&&lum<235){ink++;}}
 if(imgSrc instanceof HTMLImageElement&&imgSrc.src.startsWith("blob:"))try{URL.revokeObjectURL(imgSrc.src);}catch(e){}
 const ratio=ink/tot;return {detected:ratio>0.004,ratio};
}
function blobToImage(blob){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>res(img);img.onerror=rej;img.src=URL.createObjectURL(blob);});}

 c.innerHTML=head(t.nav.qr,t.nav.qr,t.qr_p)+`<div class="qrportal"><div class="qrcard"><div class="top"><div class="seal" style="width:32px;height:32px">${sealSVG()}</div><b style="font-size:16px">CertiLink Verify</b></div><div class="body"><div id="qrbox"></div><p class="hairnote" style="text-align:center;margin-top:0">${esc(t.scan_hint)}</p><div style="display:flex;gap:10px;margin:16px 0 4px;flex-wrap:wrap"><input class="inp" id="vidin" placeholder="${esc(t.vid)}" value="${esc(sample?sample.verification_id:"")}" style="flex:1;min-width:160px"><button class="btn gold" id="vgo">${esc(t.vnow)}</button></div><div id="vres"></div></div></div></div>`;
 const base=location.origin+location.pathname;try{new QRCode($("#qrbox"),{text:base+"?verify="+(sample?sample.verification_id:"CERTILINK"),width:148,height:148,colorDark:"#0E2740",colorLight:"#fff"});}catch(e){$("#qrbox").innerHTML='<div class="mono" style="width:148px;height:148px;display:grid;place-items:center;color:var(--muted)">QR</div>';}
 $("#vgo").onclick=async()=>{const code=$("#vidin").value.trim().toUpperCase();const res=$("#vres");const{data}=await sb.rpc("verify_document",{p_vid:code});const row=data&&data[0];
  if(!row){res.innerHTML=`<div class="card pad" style="border-color:var(--bad);color:var(--bad);margin-top:14px">✕ ${esc(t.notfound)}</div>`;return;}await logEvent("public_verify",code);
  res.innerHTML=`<div class="card pad stamped" style="margin-top:14px;border-color:var(--ok)"><div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><div class="seal" style="width:52px;height:52px">${sealSVG()}</div><div><b style="color:var(--ok);font-size:16px">${esc(t.authentic)}</b><br><span class="mono" style="font-size:12px;color:var(--muted)">${esc(code)}</span></div></div>
   <div class="kv"><span class="k">${esc(t.c_svc)}</span><span class="v">${esc(svcName(row.service_type))}</span></div>
   <div class="kv"><span class="k">${esc(t.c_app)}</span><span class="v">${esc(row.applicant_name)}</span></div>
   <div class="kv"><span class="k">${esc(t.office_v)}</span><span class="v"><span class="pill ok">✓</span></span></div>
   <div class="kv"><span class="k">${esc(t.mverified)}</span><span class="v">${row.mission_verified?'<span class="pill ok">✓</span>':'<span class="pill warn">—</span>'}</span></div>
   <div style="margin-top:12px" class="fingerbox"><div class="fl">SHA-256</div><div class="fv">${esc(row.fingerprint||"—")}</div></div></div>`;};}

async function vAudit(c){const t=L();c.innerHTML=head(t.nav.audit,t.nav.audit,t.audit_p)+`<div class="card pad" style="display:grid;place-items:center;margin-bottom:16px"><span class="spin" style="border-color:rgba(14,39,64,.2);border-top-color:var(--ink)"></span></div>`;
 const{data,error}=await sb.from("audit_log").select("*").order("id",{ascending:false}).limit(100);
 if(error){c.innerHTML=head(t.nav.audit,t.nav.audit,t.audit_p)+`<div class="card"><div class="empty">${esc(error.message)}</div></div>`;return;}
 const rows=data||[];
 c.innerHTML=head(t.nav.audit,t.nav.audit,t.audit_p)+`<div class="card pad" style="margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-color:var(--ok)"><span class="pill ok">${esc(t.chain_ok)}</span><span class="mono" style="font-size:12px;color:var(--muted)">${rows.length} ${state.lang==="ar"?"سجلّ":"records"}</span></div><div class="card">${rows.length?`<div class="tablewrap"><table class="tbl"><thead><tr><th>${esc(t.a_time)}</th><th>${esc(t.a_actor)}</th><th>${esc(t.a_action)}</th><th>${esc(t.a_hash)}</th></tr></thead><tbody>${rows.map(e=>`<tr class="row"><td class="mono" style="font-size:11.5px">${esc(fmt(e.ts))}</td><td style="font-size:13px">${esc(e.actor_name||"—")}</td><td>${esc(t.actions[e.action]||e.action)}${e.entity?` · <span class="mono" style="font-size:11px">${esc(e.entity)}</span>`:""}</td><td class="mono" style="font-size:11px;color:var(--gold-deep)">${esc((e.record_hash||"").slice(0,16))}…</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">${esc(t.noaudit)}</div>`}</div>`;}

async function aHash(file){return new Promise(res=>{try{const img=new Image();img.onload=()=>{const cv=document.createElement("canvas");cv.width=8;cv.height=8;const x=cv.getContext("2d");x.drawImage(img,0,0,8,8);const d=x.getImageData(0,0,8,8).data;const g=[];for(let i=0;i<64;i++)g.push((d[i*4]+d[i*4+1]+d[i*4+2])/3);const avg=g.reduce((a,b)=>a+b,0)/64;let bits="";for(let i=0;i<64;i++)bits+=g[i]>avg?"1":"0";let hex="";for(let i=0;i<64;i+=4)hex+=parseInt(bits.slice(i,i+4),2).toString(16);URL.revokeObjectURL(img.src);res(hex);};img.onerror=()=>res(null);img.src=URL.createObjectURL(file);}catch(e){res(null);}});}
async function vManage(c){const t=L();
 c.innerHTML=head(t.nav.manage,t.nav.manage,t.mng_p)+`<div id="mwrap"><div class="empty"><span class="spin" style="border-color:rgba(14,39,64,.2);border-top-color:var(--ink)"></span></div></div>`;
 const[r1,r2,r3,r4]=await Promise.all([sb.from("payments").select("office_fee,mission_fee"),sb.from("profiles").select("*").order("created_at",{ascending:true}),sb.from("stamp_library").select("*").order("created_at",{ascending:false}).limit(50),sb.from("notifications").select("*").order("created_at",{ascending:false}).limit(30)]);
 const pays=r1.data||[],users=r2.data||[],stamps=r3.data||[],notifs=r4.data||[];
 const revenue=pays.reduce((a,p)=>a+Number(p.office_fee||0)+Number(p.mission_fee||0),0);
 const total=state.docs.length,done=state.docs.filter(d=>["cleared","ready","handed"].includes(d.status)).length,open=total-done;
 const order=["submitted","received","verified","paid","dispatched","mission_review","cleared","ready","handed"];
 const counts=order.map(s=>[s,state.docs.filter(d=>d.status===s).length]);const max=Math.max(1,...counts.map(x=>x[1]));
 const bars=counts.map(([s,n])=>`<div style="margin:9px 0"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px"><span>${esc(t.status[s])}</span><span class="mono">${n}</span></div><div style="height:9px;background:var(--paper-2);border-radius:6px;overflow:hidden"><i style="display:block;height:100%;width:${Math.round(n/max*100)}%;background:linear-gradient(90deg,var(--gold),var(--gold-deep))"></i></div></div>`).join("");
 const feeRows=["attestation","visa","apostille"].map(sv=>`<div class="grid" style="grid-template-columns:1.2fr 1fr 1fr;gap:0 12px;align-items:end"><label class="fld"><span class="lt">${esc(t.services[sv])}</span><input class="inp" value="${esc(t.services[sv])}" disabled></label><label class="fld"><span class="lt">${esc(t.pay_office)}</span><input class="inp" id="fe_o_${sv}" type="number" value="${feeFor(sv).o}"></label><label class="fld"><span class="lt">${esc(t.pay_mission)}</span><input class="inp" id="fe_m_${sv}" type="number" value="${feeFor(sv).m}"></label></div>`).join("");
 const dpMap=state.docProfiles||{};
 const profRows=Object.keys(t.docTypes).map(dt=>`<label class="fld"><span class="lt">${esc(t.docTypes[dt])}</span><textarea class="inp" id="pf_${dt}" rows="${Math.max(2,(dpMap[dt]||[]).length)}" dir="auto">${esc((dpMap[dt]||[]).join("\n"))}</textarea></label>`).join("");
 const uRows=users.map(u=>`<tr class="row"><td>${esc(u.full_name||"—")}</td><td>${u.account_type==="individual"||!u.account_type?`<span class="pill muted">${esc(t.acc_ind)}</span>`:`<span class="pill ${u.account_type==="embassy"?"info":"tag"}">${esc(u.account_type==="embassy"?t.acc_embassy:t.acc_company)}</span>${u.org_name?` <span style="font-size:12px;color:var(--muted)">${esc(u.org_name)}</span>`:""}`}</td><td><select class="inp" style="padding:7px 10px;font-size:13px;width:auto;min-width:120px" data-uid="${esc(u.id)}">${["client","staff","verifier","cashier","courier","consul","admin"].map(r=>`<option value="${r}" ${u.role===r?"selected":""}>${esc(t.roles[r])}</option>`).join("")}</select></td><td><select class="inp" style="padding:7px 10px;font-size:13px;width:auto;min-width:110px" data-ust="${esc(u.id)}">${["active","suspended","banned"].map(s=>`<option value="${s}" ${(u.status||"active")===s?"selected":""}>${esc(s==="active"?t.st_active:s==="suspended"?t.st_suspended:t.st_banned)}</option>`).join("")}</select></td><td class="mono" style="font-size:11px;color:var(--muted)">${esc(fmt(u.created_at))}</td></tr>`).join("");
 const libRows=stamps.length?stamps.map(s=>`<tr class="row"><td>${esc(s.authority)}</td><td>${esc(s.label||"—")}</td><td><span class="pill ${s.sample_type==="genuine"?"ok":"warn"}">${esc(s.sample_type==="genuine"?t.lib_genuine:t.lib_copy)}</span></td><td class="mono" style="font-size:11px;color:var(--muted)">${esc(fmt(s.created_at))}</td></tr>`).join(""):`<tr><td colspan="4"><div class="empty">${esc(t.lib_empty)}</div></td></tr>`;
 const ntRows=notifs.length?notifs.map(n=>`<tr class="row"><td class="mono" style="font-size:11px">${esc(fmt(n.created_at))}</td><td>${esc(n.to_addr||"—")}</td><td>${esc(n.channel)}</td><td>${esc(n.template||"—")}</td><td><span class="pill ${n.status==="sent"?"ok":n.status==="failed"?"bad":"muted"}">${esc(n.status)}</span></td></tr>`).join(""):`<tr><td colspan="5"><div class="empty">${esc(t.nt_none)}</div></td></tr>`;
 c.querySelector("#mwrap").innerHTML=`
  <div class="grid stats">${stat(t.m_total,total)}${stat(t.m_rev,revenue.toFixed(2)+" "+t.cur)}${stat(t.m_open,open)}${stat(t.m_done,done)}</div>
  <div class="grid cols-2" style="margin-top:18px;align-items:start">
    <div class="card pad"><div class="sectionhead" style="margin:0 0 10px"><h2>${esc(t.by_status)}</h2></div>${bars}</div>
    <div class="card pad"><div class="sectionhead" style="margin:0 0 10px"><h2>${esc(t.mng_fees)}</h2></div>${feeRows}<button class="btn primary" id="savefees">${esc(t.save)}</button></div>
  </div>
  <div class="sectionhead"><h2>${esc(t.mng_profiles)}</h2><div class="gline"></div></div>
  <div class="card pad"><p class="hairnote" style="margin:0 0 12px">${esc(t.pr_hint)}</p><div class="grid cols-2" style="align-items:start">${profRows}</div><button class="btn primary" id="saveprofiles">${esc(t.saveall)}</button></div>
  <div class="sectionhead"><h2>${esc(t.mng_stamps)}</h2><div class="gline"></div></div>
  <div class="grid cols-2" style="align-items:start"><div class="card pad">
    <label class="fld"><span class="lt">${esc(t.lib_auth)}</span><input class="inp" id="sl_auth"></label>
    <label class="fld"><span class="lt">${esc(t.lib_label)}</span><input class="inp" id="sl_label"></label>
    <label class="fld"><span class="lt">${esc(t.lib_type)}</span><select class="inp" id="sl_type"><option value="genuine">${esc(t.lib_genuine)}</option><option value="copy">${esc(t.lib_copy)}</option></select></label>
    <label class="fld"><span class="lt">${esc(t.lib_file)}</span><div class="filebox" id="slbox"><span id="slname">${esc(t.lib_file)}</span></div><input type="file" id="sl_file" accept="image/*" class="hide"></label>
    <button class="btn gold block" id="sl_add">${esc(t.lib_add)}</button></div>
    <div class="card"><div class="tablewrap"><table class="tbl"><thead><tr><th>${esc(t.lib_auth)}</th><th>${esc(t.lib_label)}</th><th>${esc(t.lib_type)}</th><th>${esc(t.u_since)}</th></tr></thead><tbody>${libRows}</tbody></table></div></div></div>
  <div class="sectionhead"><h2>${esc(t.mng_users)}</h2><div class="gline"></div></div>
  <div class="card"><div class="tablewrap"><table class="tbl"><thead><tr><th>${esc(t.u_name)}</th><th>${esc(t.acc_type)}</th><th>${esc(t.u_role)}</th><th>${esc(t.u_status)}</th><th>${esc(t.u_since)}</th></tr></thead><tbody>${uRows||""}</tbody></table></div></div>
  <div class="sectionhead"><h2>${esc(t.mng_notif)}</h2><div class="gline"></div></div>
  <div class="card"><div class="tablewrap"><table class="tbl"><thead><tr><th>${esc(t.u_since)}</th><th>${esc(t.nt_to)}</th><th>${esc(t.nt_ch)}</th><th>${esc(t.nt_tpl)}</th><th>${esc(t.nt_st)}</th></tr></thead><tbody>${ntRows}</tbody></table></div></div>`;
 c.querySelectorAll("[data-uid]").forEach(sel=>sel.onchange=async()=>{try{const{error}=await sb.rpc("admin_set_role",{target:sel.getAttribute("data-uid"),new_role:sel.value});if(error)throw error;await logEvent("role_changed",sel.value);toast(t.role_saved);}catch(e){toast(e.message,true);}});
 c.querySelectorAll("[data-ust]").forEach(sel=>sel.onchange=async()=>{try{const{error}=await sb.rpc("admin_set_status",{target:sel.getAttribute("data-ust"),new_status:sel.value});if(error)throw error;await logEvent("status_changed",sel.value);toast(t.status_saved);}catch(e){toast(e.message,true);}});
 $("#savefees").onclick=async function(){this.disabled=true;this.innerHTML=`<span class="spin"></span>`;try{const rows=["attestation","visa","apostille"].map(sv=>({tenant_id:profile.tenant_id,service_type:sv,office_fee:Number($("#fe_o_"+sv).value||0),mission_fee:Number($("#fe_m_"+sv).value||0)}));const{error}=await sb.from("fees").upsert(rows);if(error)throw error;await fetchFees();await logEvent("fees_updated");toast(t.fees_saved);}catch(e){toast(e.message,true);}finally{this.disabled=false;this.textContent=t.save;}};
 $("#saveprofiles").onclick=async function(){this.disabled=true;this.innerHTML=`<span class="spin"></span>`;try{const rows=Object.keys(t.docTypes).map(dt=>({tenant_id:profile.tenant_id,doc_type:dt,stamps:($("#pf_"+dt).value||"").split("\n").map(s=>s.trim()).filter(Boolean)}));const{error}=await sb.from("doc_profiles").upsert(rows);if(error)throw error;await fetchDocProfiles();await logEvent("profiles_updated");toast(t.profiles_saved);}catch(e){toast(e.message,true);}finally{this.disabled=false;this.textContent=t.saveall;}};
 let slFile=null;$("#slbox").onclick=()=>$("#sl_file").click();$("#sl_file").onchange=e=>{slFile=e.target.files[0];$("#slname").innerHTML=slFile?`<b>${esc(slFile.name)}</b>`:esc(t.lib_file);};
 $("#sl_add").onclick=async function(){if(!slFile||!$("#sl_auth").value.trim()){toast(t.lib_auth,true);return;}this.disabled=true;this.innerHTML=`<span class="spin"></span>`;try{const ph=await aHash(slFile);const path=profile.tenant_id+"/"+Math.random().toString(36).slice(2)+"-"+slFile.name.replace(/[^\w.\-]/g,"_");try{await sb.storage.from("stamps").upload(path,slFile);}catch(e){}const{error}=await sb.from("stamp_library").insert({authority:$("#sl_auth").value.trim(),label:$("#sl_label").value.trim(),sample_type:$("#sl_type").value,image_path:path,phash:ph});if(error)throw error;await logEvent("stamp_added",$("#sl_auth").value.trim());toast(t.lib_added);vManage(c);}catch(e){toast(e.message,true);this.disabled=false;this.textContent=t.lib_add;}};
}

/* ============ lang + events ============ */
function setLang(l){state.lang=l;document.documentElement.lang=l;document.documentElement.dir=I[l].dir;if(session&&profile){buildNav();chrome();renderView();}else{paintAuth();}}
function toggleLang(){setLang(state.lang==="ar"?"en":"ar");}
function bindEvents(){$("#langBtn").onclick=toggleLang;$("#langAuth").onclick=toggleLang;$("#menuToggle").onclick=()=>document.body.classList.toggle("navopen");$("#scrim").onclick=()=>document.body.classList.remove("navopen");$("#tabIn").onclick=()=>{state.authMode="in";paintAuth();};$("#tabUp").onclick=()=>{state.authMode="up";paintAuth();};$("#a_go").onclick=doAuth;$("#a_forgot").onclick=doForgot;$("#a_pass").addEventListener("keydown",e=>{if(e.key==="Enter")doAuth();});}
boot();
</script>
